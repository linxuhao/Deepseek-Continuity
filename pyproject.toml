[project]
name = "dsh-continuity"
version = "0.1.6"
description = "Asset consistency and output verification for agent-generated game media. Local Vulkan backends, zero VRAM when idle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xuhao Lin" }]
keywords = ["mcp", "dsh-plugin", "deepseek-harness", "game-assets", "tts", "image-generation"]
dependencies = [
  "mcp>=2.0",
  "numpy",
  "pillow",
  # 抠图: 生图模型画出来的"透明背景"是不透明的棋盘格, 做精灵图必须转成真 RGBA
  "rembg",
  "onnxruntime",
  # continuity-setup 下权重用; 校验和续传交给它, 不自己实现
  "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/linxuhao/Deepseek-Continuity"

[project.scripts]
continuity-mcp = "continuity_mcp.server:main"
continuity-setup = "continuity_mcp.setup_cli:main"

# 分发名 dsh-continuity, import 名仍是 continuity_mcp —— 两者不必相同。
# 不叫 continuity-mcp 是因为 PyPI 上那个名字属于另一个无关项目 (2026-07 起)。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuity_mcp"]

# deploy/ (compose / Dockerfile / 权重清单) 就在包目录里, hatchling 会连非 .py 文件
# 一起打进去 —— 不需要 force-include, 加了反而会把同一个文件塞两次,
# 构建直接失败。editable 装看不出来 (它不打包), 只有真正 pip install 才炸。
