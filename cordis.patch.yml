# dsh 通过内置的 mcp-client 拉起 continuity 的 MCP server, 并负责生命周期与自动重连。
# 工具会以 mcp__continuity__<name> 出现 (create_actor / actor_tts / create_character /
# import_actor / import_subject / subject_image / remove_bg / gen_sfx / ...)。
#
# 后端引擎不在这里起 —— 先跑一次:
#     uvx --from dsh-continuity continuity-setup
# 它会体检本机 (显存/内存/磁盘)、编引擎镜像、只下这台机器用得上的权重、把两个
# ggml/Vulkan 引擎跑起来, 并按显存把下面这些变量该设的设好。
#
# 下面的 env 全部可以不填: 不填就用默认值, 那套默认值对"setup 装在同一台机器上"
# 是对的。要改的话, continuity-setup 装完会把该机器的推荐值直接打印出来。
- insert:
    - id: continuity
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: continuity
        transport: stdio
        command: uvx
        # 分发名是 dsh-continuity, 不是 continuity-mcp —— PyPI 上那个名字属于另一个
        # 完全无关的项目 (2026-07 起就在)。写成 `uvx continuity-mcp` 会在每次启动时
        # 把那个包拉下来跑, 而这里是运行时解析, 错了不会有人发现。
        # 还没发布之前用: ['--from', 'git+https://github.com/linxuhao/Deepseek-Continuity', 'continuity-mcp']
        args: ['--from', 'dsh-continuity', 'continuity-mcp']
        # env 是 z.dict(String): 值不能是 undefined, 否则整个 profile 加载失败。
        # 所以每个都 `?? ''` —— MCP server 那边把空串当成"没设", 用它自己的默认值。
        env:
          # 参考音和定妆图存放处 —— 不可复现, 丢了就是永久丢了, 建议指向有备份的位置
          CONTINUITY_STATE_DIR: !!js process.env.CONTINUITY_STATE_DIR ?? ''
          # 两个后端地址。注意宿主机侧的变量名带 CONTINUITY_ 前缀 (下面读的就是它),
          # 传进 MCP server 时才叫 SD_SERVER / AUDIO_SERVER —— continuity-setup
          # 打印的正是带前缀的那组, 照抄即可。
          SD_SERVER: !!js process.env.CONTINUITY_SD_SERVER ?? ''
          AUDIO_SERVER: !!js process.env.CONTINUITY_AUDIO_SERVER ?? ''
          # 显存不够装生图时 setup 会让你设 0, 那样只有音频那半的工具会注册
          CONTINUITY_ENABLE_IMAGE: !!js process.env.CONTINUITY_ENABLE_IMAGE ?? ''
          # 反过来那半的开关。MCP server 一直读它 (config.ENABLE_AUDIO), 只是这里从
          # 一开始就漏了列 —— 于是"只要生图、不要音频"这件事通过插件是做不到的:
          # 设了没反应, 而没有任何一层会说它没生效。
          CONTINUITY_ENABLE_AUDIO: !!js process.env.CONTINUITY_ENABLE_AUDIO ?? ''
          # best (~7.7 GiB 内存峰值) / fast (~1.3 GiB); setup 按本机内存推荐
          CONTINUITY_CUTOUT_QUALITY: !!js process.env.CONTINUITY_CUTOUT_QUALITY ?? ''
          # 参考音时长上限, 秒 (默认 15)。每秒约 0.19 GiB 显存, 不按显存分档 ——
          # 3~10 秒就足够定住音色, 放宽只会让同一段录音在你机器上能导入、别人机器上不能
          CONTINUITY_REF_MAX_S: !!js process.env.CONTINUITY_REF_MAX_S ?? ''
          # ---- BYO: 把某个能力指到别人家的后端 ----
          # 这几个必须逐个列在这里。env 是一份显式字典, 没列的键在 MCP server 那边
          # 根本不存在 —— 于是"我明明设了 CONTINUITY_ASR_SERVER"会静默无效。
          #
          # 听写: 任何 OpenAI 形状的 /v1/audio/transcriptions。空 = 跟着 AUDIO_SERVER。
          # 给根地址, 不带 /v1。
          ASR_SERVER: !!js process.env.CONTINUITY_ASR_SERVER ?? ''
          ASR_API_KEY: !!js process.env.CONTINUITY_ASR_API_KEY ?? ''
          # native (原样发, 默认) | 16000。后端只收 16 kHz 时设后者, 省掉那次
          # "先按原采样率发一遍、被 400 了再按 16k 重发"的往返。
          ASR_SEND_RATE: !!js process.env.CONTINUITY_ASR_SEND_RATE ?? ''
          # 生图: 设了它就走 /v1/images/generations, SD_SERVER 不再被使用。
          # 这一档省掉 10.1 GiB 权重和 8 GiB 显存门槛, 但 seed 会失效、尺寸被吸附到
          # 后端的枚举上 —— 每一条都会出现在工具返回的 warnings 里。
          IMAGE_API_SERVER: !!js process.env.CONTINUITY_IMAGE_API_SERVER ?? ''
          IMAGE_API_KEY: !!js process.env.CONTINUITY_IMAGE_API_KEY ?? ''
          IMAGE_API_MODEL: !!js process.env.CONTINUITY_IMAGE_API_MODEL ?? ''
          # 后端允许的尺寸枚举, 逗号分隔 (默认 1024x1024,1536x1024,1024x1536)
          IMAGE_API_SIZES: !!js process.env.CONTINUITY_IMAGE_API_SIZES ?? ''
